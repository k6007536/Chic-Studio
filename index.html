<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="CHIC STUDIO PHOTOGRAPHY">
  <title>CHIC STUDIO</title>
  <style>
    :root { --ink:#171717; --muted:#616161; --line:rgba(20,20,20,.2); --glass:rgba(246,246,244,.58); }
    * { box-sizing:border-box; }
    html { scroll-behavior:smooth; }
    body { margin:0; min-height:100vh; color:var(--ink); font-family:Arial,Helvetica,sans-serif; text-transform:uppercase; background:linear-gradient(115deg,transparent 0 19%,rgba(65,65,65,.09) 20%,transparent 23% 55%,rgba(255,255,255,.5) 57%,transparent 60%),linear-gradient(27deg,transparent 0 36%,rgba(40,40,40,.08) 39%,transparent 43% 74%,rgba(255,255,255,.38) 77%,transparent 80%),linear-gradient(150deg,#d7d7d7,#f3f3f1 34%,#c4c4c4 67%,#e7e7e5); background-attachment:fixed; }
    body::before { content:""; position:fixed; inset:0; z-index:-1; opacity:.72; background:repeating-radial-gradient(ellipse at 18% 28%,transparent 0 28px,rgba(55,55,55,.07) 30px,transparent 34px 58px),repeating-radial-gradient(ellipse at 80% 72%,transparent 0 44px,rgba(255,255,255,.3) 48px,transparent 53px 84px); filter:blur(2px); transform:scale(1.08) rotate(-3deg); }
    a { color:inherit; text-decoration:none; }
    .page { width:min(1180px,calc(100% - 48px)); min-height:100vh; margin:auto; display:grid; grid-template-rows:auto 1fr auto; }
    header { height:88px; display:flex; align-items:center; justify-content:space-between; border-bottom:1px solid var(--line); }
    .logo { font-size:.83rem; font-weight:700; letter-spacing:.22em; }
    nav { display:flex; gap:32px; }
    nav a { position:relative; padding:8px 0; color:var(--muted); font-size:.68rem; letter-spacing:.18em; }
    nav a::after { content:""; position:absolute; left:0; right:0; bottom:2px; height:1px; background:var(--ink); transform:scaleX(0); transform-origin:right; transition:transform .22s; }
    nav a:hover::after, nav a:focus-visible::after { transform:scaleX(1); transform-origin:left; }
    main { display:grid; place-items:center; padding:72px 0; }
    .hero { width:100%; padding:clamp(54px,9vw,112px) clamp(24px,6vw,80px); text-align:center; background:var(--glass); border:1px solid rgba(255,255,255,.65); box-shadow:0 26px 80px rgba(25,25,25,.09); backdrop-filter:blur(14px); }
    .eyebrow { margin:0 0 24px; color:var(--muted); font-size:.65rem; letter-spacing:.38em; }
    h1 { margin:0; font-family:"Times New Roman",Times,serif; font-size:clamp(3.4rem,10vw,8.8rem); font-weight:400; line-height:.88; letter-spacing:-.055em; }
    .service { margin:32px 0 0; color:var(--muted); font-size:clamp(.66rem,1.2vw,.82rem); letter-spacing:.25em; line-height:1.8; }
    .work { display:inline-flex; align-items:center; gap:14px; margin-top:48px; padding-bottom:8px; border-bottom:1px solid var(--ink); font-size:.68rem; letter-spacing:.23em; }
    .work span { transition:transform .22s; }
    .work:hover span { transform:translateX(5px); }
    footer { min-height:72px; display:flex; align-items:center; justify-content:space-between; gap:20px; border-top:1px solid var(--line); color:var(--muted); font-size:.61rem; letter-spacing:.17em; }
    @media (max-width:640px) { .page{width:calc(100% - 28px)} header{height:72px} nav{gap:16px} nav a{font-size:.58rem} main{padding:36px 0} .hero{padding:72px 18px} .service{max-width:250px;margin-left:auto;margin-right:auto} footer{min-height:64px;flex-direction:column;align-items:flex-start;justify-content:center;gap:5px} }
    @media (prefers-reduced-motion:reduce) { html{scroll-behavior:auto} *{transition:none!important} }
  </style>
</head>
<body>
  <div class="page">
    <header>
      <a class="logo" href="#" aria-label="CHIC STUDIO HOME">CHIC STUDIO</a>
      <nav aria-label="PRIMARY NAVIGATION"><a href="#work">WORK</a><a href="#about">ABOUT</a></nav>
    </header>
    <main>
      <section class="hero" id="about">
        <p class="eyebrow">PHOTOGRAPHY STUDIO</p>
        <h1>CHIC<br>STUDIO</h1>
        <p class="service">PORTRAIT&nbsp;&nbsp;/&nbsp;&nbsp;BRAND&nbsp;&nbsp;/&nbsp;&nbsp;SPACE</p>
        <a class="work" href="#work">VIEW WORK <span aria-hidden="true">→</span></a>
      </section>
    </main>
    <footer id="work"><span>CHIC STUDIO PHOTOGRAPHY</span><span>ALL RIGHTS RESERVED</span></footer>
  </div>
</body>
</html>
